services:
  - type: web
    name: paypilot-ai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LANGGRAPH_DB_PATH
        value: /tmp/paypilot-langgraph.db
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: DEMO_SESSION_TTL_HOURS
        value: "24"
      - key: AGENT_RUNS_PER_MINUTE
        value: "12"
      - key: GLOBAL_AGENT_RUNS_PER_MINUTE
        value: "120"
      - key: SESSION_CREATES_PER_MINUTE
        value: "60"
      - key: MAX_TRANSFER_AMOUNT
        value: "100000"
      - key: AUTO_EXECUTE_THRESHOLD
        value: "2000"
      - key: HIGH_RISK_BLOCK_SCORE
        value: "95"
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
